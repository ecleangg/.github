name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Needs rust-toolchain.toml.
  ci:
    permissions:
      contents: read
    uses: ecleangg/.github/.github/workflows/rust-ci.yml@f59a1b7b9fd06a0216f6787eb772168c791cf2a8 # main
    with:
      tools: cargo-deny
      audit: cargo deny check advisories

  # Keeps a release pull request open from Conventional Commits (needs release-plz.toml).
  release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ecleangg/.github-private/.github/workflows/release-plz.yml@47b498015e93af09a2a57636d1ad891c9e9b5c24 # main
