name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Needs rust-toolchain.toml.
  ci:
    permissions:
      contents: read
    uses: ecleangg/.github/.github/workflows/rust-ci.yml@da9c6f9906586709d1c7cdeebfc84237db6f2c92 # main
    with:
      tools: cargo-deny
      audit: cargo deny check advisories

  # Keeps a release pull request open from Conventional Commits (needs release-plz.toml).
  release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    uses: ecleangg/.github-private/.github/workflows/release-plz.yml@d45a83276297404fcd5d3e5238da2d85f638cc67 # main
