name: Repo health

on:
  schedule:
    - cron: "41 5 * * *" # Daily 05:41 UTC; artifacts older than 3 days go (the quota counts them by the hour)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Standard-files report, stale issues and PRs, old run logs/artifacts, old caches.
  # Each part can be turned off with an input; see docs/ci-standard.md.
  health:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      id-token: write # eclean-ci app token for the stale job
    uses: ecleangg/.github/.github/workflows/repo-health.yml@bf606a1efb77067403a073c6522ad192b3b5bd81 # main
