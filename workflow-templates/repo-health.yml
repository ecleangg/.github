name: Repo health

on:
  schedule:
    - cron: "41 5 * * 1" # Weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Standard-files report, stale issues and PRs, old run logs/artifacts, old caches and package versions.
  # Each part can be turned off with an input; see docs/ci-standard.md.
  health:
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
      packages: write
      id-token: write # eclean-ci app token for the stale job
    uses: ecleangg/.github/.github/workflows/repo-health.yml@edfe72b86093c9926beac7769e07fbcc83454ddf # main
