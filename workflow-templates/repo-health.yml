name: Repo health

on:
  schedule:
    - cron: "41 5 * * 1" # Weekly, Monday 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    permissions:
      contents: read
      issues: write
      actions: read
      security-events: read
    uses: ecleangg/.github/.github/workflows/repo-health.yml@da9c6f9906586709d1c7cdeebfc84237db6f2c92 # main
  stale:
    permissions:
      issues: write
      pull-requests: write
    uses: ecleangg/.github/.github/workflows/stale.yml@da9c6f9906586709d1c7cdeebfc84237db6f2c92 # main
