name: Pull request comments

# Posts the comments that the CI run prepared (e.g. the coverage summary) as eclean-ci[bot].
# Runs from the default branch after the CI run completes. List the CI workflow names exactly.
on:
  workflow_run: # zizmor: ignore[dangerous-triggers] relays artifacts to comments; runs no pull request code
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  comments:
    permissions:
      actions: read
      id-token: write
      pull-requests: write # only for the fallback to the workflow token
    uses: ecleangg/.github/.github/workflows/pr-comments.yml@edfe72b86093c9926beac7769e07fbcc83454ddf # main
