name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Docs-only changes skip the steps.
  ci:
    permissions:
      contents: read
      packages: read
      actions: read
    uses: ecleangg/.github/.github/workflows/bun-ci.yml@f59a1b7b9fd06a0216f6787eb772168c791cf2a8 # main
    with:
      format: ci-scope --full "bun run format:check" -- bunx oxfmt --check
      lint: bunx oxlint
      typecheck: bun run typecheck
      test: bunx vitest run --changed "$CI_CHANGES_BASE"
      build: bun run build

  # Keeps a release pull request open from Conventional Commits; merging it tags the version and
  # creates a draft GitHub release (needs release-please-config.json and .release-please-manifest.json).
  release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ecleangg/.github-private/.github/workflows/release-please.yml@1bf5b009c4a0fdb307e8405dc03bf60eb082a050 # main
