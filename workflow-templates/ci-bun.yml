name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Docs-only changes skip the steps.
  ci:
    permissions:
      contents: read
      packages: read
      actions: read
      pull-requests: write
    uses: ecleangg/.github/.github/workflows/bun-ci.yml@da9c6f9906586709d1c7cdeebfc84237db6f2c92 # main
    with:
      format: ci-scope --full "bun run format:check" -- bunx oxfmt --check
      lint: bunx oxlint
      typecheck: bun run typecheck
      test: bunx vitest run --changed "$ECLEAN_BASE"
      build: bun run build

  # Keeps a release pull request open from Conventional Commits; merging it tags the version and
  # creates a draft GitHub release (needs release-please-config.json and .release-please-manifest.json).
  release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ecleangg/.github-private/.github/workflows/release-please.yml@d45a83276297404fcd5d3e5238da2d85f638cc67 # main
