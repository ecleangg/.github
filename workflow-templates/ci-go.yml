name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it.
  ci:
    permissions:
      contents: read
      actions: read # Coverage baseline.
    uses: ecleangg/.github/.github/workflows/go-ci.yml@bf606a1efb77067403a073c6522ad192b3b5bd81 # main
    with:
      tools: golang.org/x/vuln/cmd/govulncheck@v1.1.4
      audit: govulncheck ./...

  # Keeps a release pull request open from Conventional Commits
  # (needs release-please-config.json and .release-please-manifest.json).
  release:
    if: github.event_name == 'push'
    needs: ci
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    uses: ecleangg/.github-private/.github/workflows/release-please.yml@1bf5b009c4a0fdb307e8405dc03bf60eb082a050 # main
