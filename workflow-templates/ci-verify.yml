name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Docs-only changes skip the steps.
  verify:
    permissions:
      contents: read
    uses: ecleangg/.github/.github/workflows/verify.yml@f59a1b7b9fd06a0216f6787eb772168c791cf2a8 # main
    with:
      command: make verify
