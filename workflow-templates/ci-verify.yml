name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Drafts skip it; marking the pull request ready for review runs it. Docs-only changes skip the steps.
  verify:
    permissions:
      contents: read
    uses: ecleangg/.github/.github/workflows/verify.yml@edfe72b86093c9926beac7769e07fbcc83454ddf # main
    with:
      command: make verify
