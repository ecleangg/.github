name: Security

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [$default-branch]
  schedule:
    - cron: "23 4 * * 1" # Weekly, Monday 04:23 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The secret scan and the workflow lint run on drafts too; the other scanners wait for ready for review.
  security:
    permissions:
      contents: read
    uses: ecleangg/.github/.github/workflows/security.yml@fcebd84b63afc3885f2b4d31a40afef822f5dec6 # main
    with:
      workflows: true
      secrets: true
      # opengrep: true # TypeScript or JavaScript in the repo
      # trivy-config: true # Dockerfiles in the repo
