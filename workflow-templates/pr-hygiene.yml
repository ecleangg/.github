name: PR hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    permissions:
      contents: read
      pull-requests: write
    uses: ecleangg/.github/.github/workflows/pr-hygiene.yml@fcebd84b63afc3885f2b4d31a40afef822f5dec6 # main
