name: Delete old Action runs

on:
  schedule:
    - cron: "0 3 * * *" # Run daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delete-runs-scheduled
  cancel-in-progress: false

jobs:
  delete-runs:
    permissions:
      actions: write
      contents: read
    uses: ./.github/workflows/delete-runs.yml
