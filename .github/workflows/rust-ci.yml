# CI for a Rust workspace: format, clippy and tests on the affected workspace members, extra checks,
# and a dependency audit, in one Verify job (the check to require). See docs/ci-standard.md for the caller.
#
# - Draft pull requests skip every job; marking the pull request ready for review runs it.
# - On pull requests `ci-rust-packages` turns the changed files into `-p` arguments for the members
#   holding them and every member depending on them; it prints nothing when no member changed.
#   Pushes, schedules, manual runs and pull requests touching Cargo.lock, a Cargo.toml, the toolchain
#   pin or tool configuration check the whole workspace (`--workspace`).
# - The toolchain comes from rust-toolchain.toml through rustup (on the self-hosted runners in the
#   shared RUSTUP_HOME), rustc runs behind the runner's sccache, and `target` is kept on the runner's
#   disk between runs (actions/local-cache): saved from the default branch once per toolchain and
#   Cargo.lock (compiled dependencies are what it saves; sccache covers the rest).
# - `setup` runs after the toolchain and before format and lint (install dependencies, generate code).
# - `compose-file` starts a Docker Compose stack before the tests and removes it (`down -v`) at the
#   end, under a project name unique to the run. Compose files with fixed container names or ports
#   still collide between runs: set `concurrency-group` to serialize those runs.
# - `coverage` produces an lcov file after the tests and reports it with coverage-summary (the caller
#   grants `actions: read` and `pull-requests: write`).
# - Every step runs in bash, so a Windows runner (Git Bash) works with runs-on '["self-hosted","Windows","X64"]'.
name: Rust CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
      working-directory:
        description: "Workspace root, relative to the repository root"
        type: string
        default: "."
      env:
        description: "Newline-separated NAME=value lines exported to every step (no secrets)"
        type: string
        default: ""
      filters:
        description: "actions/changed-files filters; steps run only when `code` matches"
        type: string
        default: |
          code: * !*.md !docs/* !LICENSE* !.github/ISSUE_TEMPLATE/* !.github/*.md
      full-patterns:
        description: "Extra globs that make a pull request check everything"
        type: string
        default: ""
      setup:
        description: "Multi-line script run after the toolchain and before format and lint, e.g. bun install --frozen-lockfile or code generation"
        type: string
        default: ""
      tools:
        description: "Comma-separated cargo tools for taiki-e/install-action (prebuilt binaries, kept in CARGO_HOME), e.g. cargo-nextest,cargo-deny"
        type: string
        default: ""
      postgres:
        description: "Postgres image to start for the tests (DATABASE_URL is set for the test and extra steps); empty: none"
        type: string
        default: ""
      compose-file:
        description: "Docker Compose file to start before the tests (relative to working-directory); empty: none"
        type: string
        default: ""
      compose-profiles:
        description: "Comma- or space-separated Compose profiles to enable with compose-file"
        type: string
        default: ""
      compose-project:
        description: "Compose project name; empty: <repo>-<run id>-<job>, lowercased"
        type: string
        default: ""
      concurrency-group:
        description: "Serialize verify jobs sharing this group (queue: max), e.g. when the Compose file uses fixed container names or ports; empty: no limit"
        type: string
        default: ""
      format:
        description: "Format check"
        type: string
        default: cargo fmt --all --check
      lint:
        description: 'Lint command; $PACKAGES holds the affected members ("-p a -p b" or --workspace)'
        type: string
        default: cargo clippy $PACKAGES --all-targets --locked -- -D warnings
      test:
        description: "Test command; $PACKAGES as for lint"
        type: string
        default: cargo test $PACKAGES --locked
      extra:
        description: "More checks after the tests, as a multi-line script"
        type: string
        default: ""
      coverage:
        description: "Command that writes an lcov file after the tests, e.g. cargo llvm-cov $PACKAGES --locked --lcov --output-path lcov.info; empty: none"
        type: string
        default: ""
      coverage-file:
        description: "lcov file the coverage command writes, relative to working-directory"
        type: string
        default: lcov.info
      coverage-name:
        description: "Name of the coverage comment and baseline artifact; defaults to the repository name"
        type: string
        default: ""
      audit:
        description: "Dependency audit (e.g. cargo deny check advisories); every non-draft event"
        type: string
        default: ""
      cache-target:
        description: "Keep target/ between runs"
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 45

permissions: {}

jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # Without a group the key is unique to this run, so nothing queues.
    concurrency:
      group: ${{ inputs.concurrency-group != '' && inputs.concurrency-group || format('rust-ci-{0}-{1}', github.run_id, github.run_attempt) }}
      queue: max
    permissions:
      contents: read
      actions: read
      pull-requests: write
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: $/.github/actions/changed-files
        with:
          filters: ${{ inputs.filters }}
          full-patterns: ${{ inputs.full-patterns }}
      - name: Export env and the affected members
        id: run
        env:
          INPUT_ENV: ${{ inputs.env }}
          MATCHES: ${{ steps.changes.outputs.matches }}
        run: |
          printf '%s\n' "$INPUT_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV" || true
          code="$(jq -r '.code // true' <<< "$MATCHES")"
          if [ "$code" = true ]; then
            packages="$(ci-rust-packages)"
            echo "PACKAGES=$packages" >> "$GITHUB_ENV"
            # No member changed (only workflow or root files): nothing for clippy and tests.
            [ -n "$packages" ] || code=false
            echo "Members: ${packages:-none}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        if: steps.run.outputs.code == 'true'
        run: |
          # rustup installs the rust-toolchain.toml pin (into the shared RUSTUP_HOME on our runners).
          rustup show active-toolchain || rustup toolchain install
          rustc --version
          cargo --version
          if command -v sccache > /dev/null && [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --zero-stats > /dev/null || true; fi
      - name: Install cargo tools
        if: steps.run.outputs.code == 'true' && inputs.tools != ''
        uses: taiki-e/install-action@1919c4a95903d2c33e4a221102edca87309fc14b # v2.89.0
        with:
          tool: ${{ inputs.tools }}
      - name: Restore target
        id: cache
        if: steps.run.outputs.code == 'true' && inputs.cache-target
        uses: $/.github/actions/local-cache/restore
        with:
          path: target
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: rust-target-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml', '**/rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            rust-target-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml', '**/rust-toolchain') }}-
      - name: Postgres
        id: postgres
        if: steps.run.outputs.code == 'true' && inputs.postgres != ''
        uses: $/.github/actions/postgres
        with:
          image: ${{ inputs.postgres }}
      - name: Setup
        if: steps.run.outputs.code == 'true' && inputs.setup != ''
        env:
          CMD: ${{ inputs.setup }}
        run: bash -euo pipefail -c "$CMD"
      - parallel:
          - name: Format
            if: steps.run.outputs.code == 'true' && inputs.format != ''
            env:
              CMD: ${{ inputs.format }}
            run: bash -euo pipefail -c "$CMD"
          - name: Lint
            if: steps.run.outputs.code == 'true' && inputs.lint != ''
            env:
              CMD: ${{ inputs.lint }}
            run: bash -euo pipefail -c "$CMD"
      - name: Compose up
        id: compose
        if: steps.run.outputs.code == 'true' && inputs.compose-file != ''
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
          COMPOSE_PROFILES_INPUT: ${{ inputs.compose-profiles }}
          COMPOSE_PROJECT_INPUT: ${{ inputs.compose-project }}
        run: |
          project="${COMPOSE_PROJECT_INPUT:-${GITHUB_REPOSITORY#*/}-${GITHUB_RUN_ID}-${GITHUB_JOB}}"
          project="$(printf '%s' "$project" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_-' '-')"
          echo "COMPOSE_PROJECT_NAME=$project" >> "$GITHUB_ENV"
          echo "started=true" >> "$GITHUB_OUTPUT"
          args=(-f "$COMPOSE_FILE_INPUT")
          for profile in ${COMPOSE_PROFILES_INPUT//,/ }; do args+=(--profile "$profile"); done
          COMPOSE_PROJECT_NAME="$project" docker compose "${args[@]}" up -d --wait
      - name: Test
        if: ${{ !cancelled() && steps.run.outputs.code == 'true' && inputs.test != '' }}
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.url }}
          CMD: ${{ inputs.test }}
        run: bash -euo pipefail -c "$CMD"
      - name: Extra checks
        if: ${{ !cancelled() && steps.run.outputs.code == 'true' && inputs.extra != '' }}
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.url }}
          CMD: ${{ inputs.extra }}
        run: bash -euo pipefail -c "$CMD"
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() && steps.run.outputs.code == 'true' && inputs.coverage != '' }}
        env:
          DATABASE_URL: ${{ steps.postgres.outputs.url }}
          CMD: ${{ inputs.coverage }}
        run: bash -euo pipefail -c "$CMD"
      - name: Coverage summary
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.coverage-file)) != '' }}
        uses: $/.github/actions/coverage-summary
        with:
          name: ${{ inputs.coverage-name != '' && inputs.coverage-name || github.event.repository.name }}
          format: lcov
          file: ${{ inputs.working-directory }}/${{ inputs.coverage-file }}
      - name: Dependency audit
        if: ${{ !cancelled() && inputs.audit != '' }}
        env:
          CMD: ${{ inputs.audit }}
        run: bash -euo pipefail -c "$CMD"
      - name: sccache stats
        if: ${{ !cancelled() && steps.run.outputs.code == 'true' }}
        run: |
          if command -v sccache > /dev/null && [ -n "${RUSTC_WRAPPER:-}" ]; then
            { echo '```'; sccache --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          fi
      - name: Compose down
        if: ${{ always() && steps.compose.outputs.started == 'true' }}
        env:
          COMPOSE_FILE_INPUT: ${{ inputs.compose-file }}
        run: docker compose -f "$COMPOSE_FILE_INPUT" down -v
      - name: Stop Postgres
        if: ${{ always() && steps.postgres.outputs.container != '' }}
        env:
          CONTAINER: ${{ steps.postgres.outputs.container }}
        run: docker rm -f "$CONTAINER" > /dev/null
      - name: Save target
        if: ${{ success() && steps.run.outputs.code == 'true' && inputs.cache-target && steps.cache.outputs.cache-hit != 'true' && github.ref_name == github.event.repository.default_branch }}
        uses: $/.github/actions/local-cache/save
        with:
          path: target
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: rust-target-${{ runner.os }}-${{ hashFiles('**/rust-toolchain.toml', '**/rust-toolchain') }}-${{ hashFiles('**/Cargo.lock') }}
