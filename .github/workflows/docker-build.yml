# Builds a Docker image without pushing it, as a pull request check, and scans the result with
# actions/trivy-image. Publishing (registry login, push, signing) is in ecleangg/.github-private.
#
# Draft pull requests skip it. On the self-hosted runners BuildKit's layer cache is a directory on the
# runner's disk (ECLEAN_ACTIONS_CACHE), read by every run and written from the default branch; on
# GitHub-hosted runners it is the GitHub Actions cache.
name: Docker build

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels; needs Docker. Defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
      name:
        description: "Image name, for the cache directory and the summary (e.g. booky)"
        type: string
        required: true
      context:
        description: "Build context"
        type: string
        default: "."
      file:
        description: "Dockerfile, relative to the repository root"
        type: string
        default: Dockerfile
      target:
        description: "Build stage"
        type: string
        default: ""
      build-args:
        description: "Newline-separated build arguments (no secrets)"
        type: string
        default: ""
      packages-secret:
        description: "Pass the workflow token as the BuildKit secret `github_packages_token` (reads @ecleangg packages; grant packages: read)"
        type: boolean
        default: false
      filters:
        description: "actions/changed-files filters; the build runs only when `image` matches"
        type: string
        default: |
          image: * !*.md !docs/* !LICENSE* !.github/ISSUE_TEMPLATE/* !.github/*.md
      scan:
        description: "Scan the built image with actions/trivy-image (HIGH and CRITICAL fail)"
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 45

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.name }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read # @ecleangg packages, with packages-secret.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: $/.github/actions/changed-files
        with:
          filters: ${{ inputs.filters }}
      - name: Pick the layer cache
        id: cache
        if: fromJSON(steps.changes.outputs.matches).image
        env:
          NAME: ${{ inputs.name }}
          WRITE: ${{ github.ref_name == github.event.repository.default_branch }}
          PACKAGES_SECRET: ${{ inputs.packages-secret }}
          TOKEN: ${{ github.token }}
        run: |
          {
            echo "secrets<<ECLEAN_EOF"
            if [ "$PACKAGES_SECRET" = true ]; then echo "github_packages_token=$TOKEN"; fi
            echo "ECLEAN_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${ECLEAN_ACTIONS_CACHE:-}" ] && [ -w "$ECLEAN_ACTIONS_CACHE" ]; then
            dir="$ECLEAN_ACTIONS_CACHE/$GITHUB_REPOSITORY/buildx/$NAME"
            mkdir -p "$dir"
            echo "from=type=local,src=$dir" >> "$GITHUB_OUTPUT"
            # BuildKit replaces a local cache directory in place; write a fresh one and swap it in.
            if [ "$WRITE" = true ]; then echo "to=type=local,dest=$dir.new,mode=max" >> "$GITHUB_OUTPUT"; fi
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          else
            echo "from=type=gha,scope=$NAME" >> "$GITHUB_OUTPUT"
            if [ "$WRITE" = true ]; then echo "to=type=gha,scope=$NAME,mode=max" >> "$GITHUB_OUTPUT"; fi
          fi
      - if: fromJSON(steps.changes.outputs.matches).image
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        if: fromJSON(steps.changes.outputs.matches).image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ inputs.name }}:ci
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          github-token: ""
          secrets: ${{ steps.cache.outputs.secrets }}
      - name: Swap in the new layer cache
        if: success() && steps.cache.outputs.dir != '' && steps.cache.outputs.to != ''
        env:
          DIR: ${{ steps.cache.outputs.dir }}
        run: |
          rm -rf "$DIR.old"
          if [ -d "$DIR" ]; then mv "$DIR" "$DIR.old"; fi
          mv "$DIR.new" "$DIR"
          rm -rf "$DIR.old"
      - name: Scan
        if: fromJSON(steps.changes.outputs.matches).image && inputs.scan
        uses: $/.github/actions/trivy-image
        with:
          tarball: ${{ runner.temp }}/image.tar
          title: ${{ inputs.name }}
