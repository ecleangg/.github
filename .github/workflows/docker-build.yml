# Builds a Docker image without pushing it, as a pull request check, and scans the result with
# actions/trivy-image. Publishing (registry login, push, signing) is in ecleangg/.github-private.
#
# Draft pull requests skip it. On the self-hosted runners the build runs on the Docker daemon's own
# BuildKit (buildx `docker` driver), whose layer cache and RUN --mount=type=cache directories persist
# on the runner and are shared by every branch and job; the daemon's builder GC bounds them. On
# GitHub-hosted runners the layer cache is the GitHub Actions cache, written from the default branch.
name: Docker build

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels. Empty: the self-hosted Linux pool; with the variable CI_RUNNER_POOLS on, also its `heavy` label; needs Docker'
        type: string
        default: ''
      name:
        description: "Image name, for the cache directory and the summary (e.g. booky)"
        type: string
        required: true
      context:
        description: "Build context"
        type: string
        default: "."
      file:
        description: "Dockerfile, relative to the repository root"
        type: string
        default: Dockerfile
      target:
        description: "Build stage"
        type: string
        default: ""
      build-args:
        description: "Newline-separated build arguments (no secrets)"
        type: string
        default: ""
      packages-secret:
        description: "Pass the workflow token as the BuildKit secret `github_packages_token` (reads @ecleangg packages; grant packages: read)"
        type: boolean
        default: false
      forgejo-npm:
        description: "Read @ecleangg packages from our Forgejo registry: log in to OpenBao (role ci-npm-read) and pass its read-only token as the BuildKit secret `forgejo_packages_token`. The caller's job needs `id-token: write`"
        type: boolean
        default: false
      filters:
        description: "actions/changed-files filters; the build runs only when `image` matches"
        type: string
        default: |
          image: * !*.md !docs/* !LICENSE* !.github/ISSUE_TEMPLATE/* !.github/*.md
      scan:
        description: "Scan the built image with actions/trivy-image (HIGH and CRITICAL fail)"
        type: boolean
        default: true
      heavy-slots:
        description: "Queue for a host slot before the heavy steps, so a runner host does not run more than CI_HEAVY_SLOTS_* of these jobs at once (actions/host-slot)"
        type: boolean
        default: true
      timeout-minutes:
        type: number
        default: 45

permissions: {}

jobs:
  build:
    name: Build ${{ inputs.name }}
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on || (vars.CI_RUNNER_POOLS == 'on' && fromJSON(format('["self-hosted","Linux","X64","{0}"]', 'heavy')) || fromJSON('["self-hosted","Linux","X64"]')) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read # @ecleangg packages, with packages-secret.
      id-token: write # The OpenBao login for `forgejo-npm`.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: changes
        uses: $/.github/actions/changed-files
        with:
          filters: ${{ inputs.filters }}
      - name: Forgejo registry login
        id: forgejo
        if: inputs.forgejo-npm && fromJSON(steps.changes.outputs.matches).image
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://secret.eclean.gg
          method: jwt
          role: ci-npm-read
          jwtGithubAudience: https://secret.eclean.gg
          exportEnv: false
          secrets: |
            kv/data/ci/npm-read/forgejo-registry token | FORGEJO_NPM_TOKEN
      - name: Pick the layer cache
        id: cache
        if: fromJSON(steps.changes.outputs.matches).image
        env:
          NAME: ${{ inputs.name }}
          WRITE: ${{ github.ref_name == github.event.repository.default_branch }}
          SELF_HOSTED: ${{ runner.environment == 'self-hosted' }}
          PACKAGES_SECRET: ${{ inputs.packages-secret }}
          TOKEN: ${{ github.token }}
          FORGEJO_TOKEN: ${{ steps.forgejo.outputs.FORGEJO_NPM_TOKEN }}
        run: |
          {
            echo "secrets<<ECLEAN_EOF"
            if [ "$PACKAGES_SECRET" = true ]; then echo "github_packages_token=$TOKEN"; fi
            if [ -n "$FORGEJO_TOKEN" ]; then echo "forgejo_packages_token=$FORGEJO_TOKEN"; fi
            echo "ECLEAN_EOF"
          } >> "$GITHUB_OUTPUT"
          # Self-hosted: the daemon's BuildKit keeps its cache itself, nothing to import or export.
          if [ "$SELF_HOSTED" = true ]; then
            echo "driver=docker" >> "$GITHUB_OUTPUT"
          else
            echo "driver=docker-container" >> "$GITHUB_OUTPUT"
            echo "from=type=gha,scope=$NAME" >> "$GITHUB_OUTPUT"
            if [ "$WRITE" = true ]; then echo "to=type=gha,scope=$NAME,mode=max" >> "$GITHUB_OUTPUT"; fi
          fi
      - if: fromJSON(steps.changes.outputs.matches).image
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ steps.cache.outputs.driver }}
      # Queues for one of the host's heavy slots (variables CI_HEAVY_SLOTS_LINUX / _WINDOWS, default 3 / 2),
      # so a host runs only that many image builds at once. See actions/host-slot.
      - name: Heavy-job slot
        if: fromJSON(steps.changes.outputs.matches).image && inputs.heavy-slots
        uses: $/.github/actions/host-slot
        with:
          slots-linux: ${{ vars.CI_HEAVY_SLOTS_LINUX }}
          slots-windows: ${{ vars.CI_HEAVY_SLOTS_WINDOWS }}
      - name: Build
        if: fromJSON(steps.changes.outputs.matches).image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: linux/amd64
          push: false
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          tags: ${{ inputs.name }}:ci
          cache-from: ${{ steps.cache.outputs.from }}
          cache-to: ${{ steps.cache.outputs.to }}
          github-token: ""
          secrets: ${{ steps.cache.outputs.secrets }}
      - name: Scan
        if: fromJSON(steps.changes.outputs.matches).image && inputs.scan
        uses: $/.github/actions/trivy-image
        with:
          tarball: ${{ runner.temp }}/image.tar
          title: ${{ inputs.name }}
