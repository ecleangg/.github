# Weekly repo housekeeping. Call it from a schedule (and workflow_dispatch) in each repo. Each job
# has its own boolean input and runs by default:
#   - files:    standard files missing from the repo and not provided by the org's `.github` repo,
#               as a job-summary table (never fails)
#   - stale:    long-inactive issues and pull requests (drafts included): warning comment, then close
#   - runs:     logs and artifacts of workflow runs older than `max-age-days` (run metadata stays)
#   - caches:   GitHub Actions caches not accessed for `cache-max-age-days`
#   - packages: old versions of the container and npm packages linked to this repository
# The caller grants the union of the job permissions: contents: read, issues: write,
# pull-requests: write, actions: write, packages: write (see docs/ci-standard.md). No issue is opened.
# `dry-run` makes runs, caches and packages only list what they would delete.
name: Repo health

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
      dry-run:
        description: "Only list what runs, caches and packages would delete"
        type: boolean
        default: false
      files:
        description: "Report missing standard files in the job summary"
        type: boolean
        default: true
      stale:
        description: "Warn and close long-inactive issues and pull requests"
        type: boolean
        default: true
      days-before-stale:
        description: "Days of inactivity before an issue or pull request gets the warning"
        type: number
        default: 90
      days-before-close:
        description: "Days after the warning before it is closed"
        type: number
        default: 14
      exempt-labels:
        description: "Comma-separated labels that are never marked stale (issues and pull requests)"
        type: string
        default: pinned,security,keep
      runs:
        description: "Delete logs and artifacts of old workflow runs"
        type: boolean
        default: true
      max-age-days:
        description: "Age in days after which run logs and artifacts are deleted"
        type: number
        default: 7
      lookback-days:
        description: "Only runs created within this many days before the cutoff are visited (earlier ones were cleaned by earlier runs); 0: all"
        type: number
        default: 14
      max-deletions:
        description: "Most runs-job deletions (log and artifact deletes together) per run; keeps the job within API rate limits"
        type: number
        default: 1000
      caches:
        description: "Delete Actions caches that have not been accessed recently"
        type: boolean
        default: true
      cache-max-age-days:
        description: "Days without access after which a cache is deleted"
        type: number
        default: 3
      packages:
        description: "Delete old versions of the container and npm packages linked to this repository"
        type: boolean
        default: true
      package-names:
        description: "Newline-separated `container:name` / `npm:name` packages to prune; default the image named after the repository and the @<org> npm package in package.json"
        type: string
        default: ""
      keep-versions:
        description: "Tagged container versions (all npm versions) to keep per package, newest first"
        type: number
        default: 2

permissions: {}

jobs:
  files:
    name: Standard files
    if: ${{ inputs.files }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const status = (error) => error.status ?? 0;

            const { data: info } = await github.rest.repos.get({ owner, repo });
            const { data: tree } = await github.rest.git.getTree({
              owner, repo, tree_sha: info.default_branch, recursive: 'true',
            });
            const paths = tree.tree.map((entry) => entry.path);
            const has = (re) => paths.some((p) => re.test(p));

            // What the org `.github` repo provides as defaults.
            const orgPaths = new Set();
            for (const dir of ['', '.github', 'docs']) {
              try {
                const { data } = await github.rest.repos.getContent({ owner: 'ecleangg', repo: '.github', path: dir });
                for (const item of data) orgPaths.add(item.path);
              } catch (error) {
                if (status(error) !== 404) throw error;
              }
            }
            const orgHas = (re) => [...orgPaths].some((p) => re.test(p));

            const standard = [
              { name: 'README', own: /^README/i, org: null },
              { name: 'CODEOWNERS', own: /^(\.github\/|docs\/)?CODEOWNERS$/, org: null },
              { name: 'SECURITY.md', own: /^(\.github\/|docs\/)?SECURITY\.md$/i, org: /(^|\/)SECURITY\.md$/i },
              { name: 'CONTRIBUTING.md', own: /^(\.github\/|docs\/)?CONTRIBUTING\.md$/i, org: /(^|\/)CONTRIBUTING\.md$/i },
              { name: 'CODE_OF_CONDUCT.md', own: /^(\.github\/|docs\/)?CODE_OF_CONDUCT\.md$/i, org: /(^|\/)CODE_OF_CONDUCT\.md$/i },
              { name: 'Issue templates', own: /^\.github\/ISSUE_TEMPLATE\//i, org: /(^|\/)ISSUE_TEMPLATE\//i },
              { name: 'Pull request template', own: /^(\.github\/|docs\/)?(PULL_REQUEST_TEMPLATE(\.md|\/)|pull_request_template\.md)/i, org: /(^|\/)(PULL_REQUEST_TEMPLATE(\.md|\/)|pull_request_template\.md)/i },
            ];
            if (!info.private) standard.splice(1, 0, { name: 'LICENSE', own: /^(LICENSE|LICENCE|COPYING)/i, org: null });

            const rows = [[{ data: 'File', header: true }, { data: 'Status', header: true }]];
            for (const f of standard) {
              const own = has(f.own);
              const inherited = !own && f.org && orgHas(f.org);
              rows.push([f.name, own ? 'in repo' : inherited ? 'from the org `.github` repo' : 'missing']);
            }
            const missing = rows.slice(1).filter((r) => r[1] === 'missing').length;
            await core.summary
              .addHeading('Standard files', 3)
              .addTable(rows)
              .addRaw(missing === 0 ? 'Nothing missing.' : `${missing} missing.`, true)
              .write();

  stale:
    name: Stale
    if: ${{ inputs.stale }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: ${{ inputs.days-before-stale }}
          days-before-close: ${{ inputs.days-before-close }}
          exempt-issue-labels: ${{ inputs.exempt-labels }}
          exempt-pr-labels: ${{ inputs.exempt-labels }}
          exempt-draft-pr: false
          operations-per-run: 250
          debug-only: ${{ inputs.dry-run }}
          stale-issue-message: >-
            Nothing has happened here for a while, so this is marked stale. Comment or add the
            `keep` label if it is still relevant; otherwise it closes automatically in
            ${{ inputs.days-before-close }} days.
          stale-pr-message: >-
            Nothing has happened here for a while, so this is marked stale. Push a change, comment
            or add the `keep` label if it is still relevant; otherwise it closes automatically in
            ${{ inputs.days-before-close }} days.
          close-issue-message: >-
            Closing this due to inactivity. Feel free to reopen it if it is still relevant.
          close-pr-message: >-
            Closing this due to inactivity. Feel free to reopen it, or open a new pull request, if
            it is still relevant.

  runs:
    name: Run logs and artifacts
    if: ${{ inputs.runs }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAX_AGE_DAYS: ${{ inputs.max-age-days }}
          LOOKBACK_DAYS: ${{ inputs.lookback-days }}
          MAX_DELETIONS: ${{ inputs.max-deletions }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const maxDeletions = Number(process.env.MAX_DELETIONS);
            const day = 24 * 60 * 60 * 1000;
            const cutoff = new Date(Date.now() - Number(process.env.MAX_AGE_DAYS) * day);
            const floor = Number(process.env.LOOKBACK_DAYS) > 0
              ? new Date(cutoff.getTime() - Number(process.env.LOOKBACK_DAYS) * day)
              : null;
            const iso = (d) => d.toISOString().replace(/\.\d+Z$/, 'Z');
            const counts = { logs: 0, logsGone: 0, artifacts: 0, skipped: 0, failed: 0 };
            let budget = maxDeletions;
            let rateLimited = false;

            // Runs the delete unless this is a dry run or the budget is spent. Returns true on a delete,
            // 'gone' when the target no longer exists.
            const remove = async (label, fn) => {
              if (rateLimited || budget <= 0) return false;
              if (dryRun) { budget -= 1; core.info(`Would delete ${label}`); return true; }
              try {
                await fn();
                budget -= 1;
                return true;
              } catch (error) {
                if (error.status === 404 || error.status === 410) return 'gone';
                if (error.status === 403 || error.status === 429) {
                  rateLimited = true;
                  core.warning(`Rate limited at ${label}: ${error.message}`);
                  return false;
                }
                counts.failed += 1;
                core.warning(`${label}: ${error.message}`);
                return false;
              }
            };

            // 1. Logs of completed runs. The created filter returns at most 1000 runs per query, so
            //    when a query fills up the next one continues below its oldest run.
            let upper = `<${iso(cutoff)}`;
            if (floor) upper = `${iso(floor)}..${iso(cutoff)}`;
            let windows = 0;
            while (budget > 0 && !rateLimited && windows < 5) {
              windows += 1;
              const found = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner, repo, created: upper, per_page: 100,
              });
              for (const run of found) {
                if (run.status !== 'completed') { counts.skipped += 1; continue; }
                const result = await remove(`logs of run ${run.id}`, () => github.rest.actions.deleteWorkflowRunLogs({ owner, repo, run_id: run.id }));
                if (result === 'gone') counts.logsGone += 1;
                else if (result) counts.logs += 1;
              }
              if (found.length < 1000) break;
              const oldest = new Date(found[found.length - 1].created_at);
              upper = floor ? `${iso(floor)}..${iso(new Date(oldest.getTime() - 1000))}` : `<${iso(oldest)}`;
            }

            // 2. Artifacts created before the cutoff.
            for await (const page of github.paginate.iterator(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 })) {
              if (budget <= 0 || rateLimited) break;
              for (const artifact of page.data) {
                if (artifact.expired || new Date(artifact.created_at) >= cutoff) continue;
                if (await remove(`artifact ${artifact.id} (${artifact.name})`, () => github.rest.actions.deleteArtifact({ owner, repo, artifact_id: artifact.id }))) {
                  counts.artifacts += 1;
                }
              }
            }

            const verb = dryRun ? 'would delete' : 'deleted';
            const capped = budget <= 0 ? ` The cap of ${maxDeletions} deletions was reached; the next run continues.` : '';
            await core.summary
              .addHeading('Run logs and artifacts', 3)
              .addRaw(`Older than ${process.env.MAX_AGE_DAYS} days (created before ${iso(cutoff)}): ${verb} logs of ${counts.logs} runs and ${counts.artifacts} artifacts. ${counts.logsGone} runs had no logs left, ${counts.skipped} were still running, ${counts.failed} failed.${rateLimited ? ' Stopped early: rate limited.' : ''}${capped}`, true)
              .write();

  caches:
    name: Actions caches
    if: ${{ inputs.caches }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          MAX_AGE_DAYS: ${{ inputs.cache-max-age-days }}
          DRY_RUN: ${{ inputs.dry-run }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const cutoff = new Date(Date.now() - Number(process.env.MAX_AGE_DAYS) * 24 * 60 * 60 * 1000);
            let deleted = 0, bytes = 0, failed = 0, kept = 0;

            // Least recently used first, so the first cache accessed after the cutoff ends the scan.
            scan: for await (const page of github.paginate.iterator(github.rest.actions.getActionsCacheList, {
              owner, repo, sort: 'last_accessed_at', direction: 'asc', per_page: 100,
            })) {
              for (const cache of page.data) {
                if (new Date(cache.last_accessed_at) >= cutoff) break scan;
                if (dryRun) {
                  core.info(`Would delete cache ${cache.id} (${cache.key})`);
                } else {
                  try {
                    await github.rest.actions.deleteActionsCacheById({ owner, repo, cache_id: cache.id });
                  } catch (error) {
                    if (error.status !== 404) {
                      failed += 1;
                      core.warning(`Cache ${cache.id} (${cache.key}): ${error.message}`);
                    }
                    continue;
                  }
                }
                deleted += 1;
                bytes += cache.size_in_bytes ?? 0;
              }
            }

            const mb = (bytes / 1024 / 1024).toFixed(1);
            await core.summary
              .addHeading('Actions caches', 3)
              .addRaw(`Not accessed for ${process.env.MAX_AGE_DAYS} days: ${dryRun ? 'would delete' : 'deleted'} ${deleted} caches (${mb} MiB), ${failed} failed.`, true)
              .write();

  packages:
    name: Package versions
    if: ${{ inputs.packages }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          KEEP: ${{ inputs.keep-versions }}
          DRY_RUN: ${{ inputs.dry-run }}
          PACKAGES: ${{ inputs.package-names }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const keep = Math.max(1, Number(process.env.KEEP));
            const hour = 60 * 60 * 1000;
            const rows = [[
              { data: 'Package', header: true }, { data: 'Type', header: true },
              { data: 'Versions', header: true }, { data: 'Kept', header: true },
              { data: dryRun ? 'Would delete' : 'Deleted', header: true }, { data: 'Failed', header: true },
            ]];

            // cosign signatures, attestations and SBOMs: `sha256-<digest>[.sig|.att|.sbom]`.
            const isSignatureTag = (tag) => /^sha256-[0-9a-f]{64}(\.(sig|att|sbom))?$/.test(tag);
            const tagsOf = (v) => v.metadata?.container?.tags ?? [];
            const byNewest = (a, b) => new Date(b.created_at) - new Date(a.created_at);

            // Versions to delete for a container package.
            const containerVictims = (versions) => {
              const tagged = versions.filter((v) => tagsOf(v).some((t) => !isSignatureTag(t)));
              const kept = tagged.slice(0, keep);
              if (kept.length === 0) return [];
              // Children, signatures and attestations are pushed around the tagged manifest, shortly
              // before (multi-arch children) and after (signatures) it; keep everything from an hour
              // before the oldest kept version onwards.
              const floor = new Date(kept[kept.length - 1].created_at).getTime() - hour;
              return versions.filter((v) => new Date(v.created_at).getTime() < floor
                && !kept.includes(v)
                && !tagsOf(v).includes('latest'));
            };

            // The workflow token can't list the org's packages, so each one is addressed by name:
            // `package-names` lines (`container:name`, `npm:name`), or by default the image named after the
            // repository and the published @<org> npm package in package.json. Missing ones are skipped.
            const candidates = [];
            const explicit = (process.env.PACKAGES || '').trim();
            if (explicit) {
              for (const line of explicit.split('\n').map((l) => l.trim()).filter(Boolean)) {
                const [type, ...rest] = line.split(':');
                candidates.push({ type, name: rest.join(':') });
              }
            } else {
              candidates.push({ type: 'container', name: repo });
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: 'package.json' });
                const pkg = JSON.parse(Buffer.from(data.content, 'base64').toString());
                if (typeof pkg.name === 'string' && pkg.name.startsWith(`@${owner}/`) && !pkg.private) {
                  candidates.push({ type: 'npm', name: pkg.name.slice(owner.length + 2) });
                }
              } catch (e) {
                if (e.status !== 404) throw e;
              }
            }
            const packages = [];
            for (const c of candidates) {
              try {
                await github.request('GET /orgs/{org}/packages/{package_type}/{package_name}', {
                  org: owner, package_type: c.type, package_name: c.name,
                });
                packages.push(c);
              } catch (e) {
                if (e.status === 404 || e.status === 403) core.info(`No ${c.type} package ${c.name} for this repository.`);
                else throw e;
              }
            }
            if (packages.length === 0) core.info(`No container or npm packages for ${owner}/${repo}.`);

            let rateLimited = false;
            for (const { type, name } of packages) {
              const versions = (await github.paginate('GET /orgs/{org}/packages/{package_type}/{package_name}/versions', {
                org: owner, package_type: type, package_name: name, per_page: 100,
              })).sort(byNewest);
              const victims = type === 'npm' ? versions.slice(keep) : containerVictims(versions);
              let deleted = 0, failed = 0;
              for (const v of victims) {
                const label = `${type} ${name} version ${v.id} (${tagsOf(v).join(', ') || v.name})`;
                if (dryRun) { core.info(`Would delete ${label}`); deleted += 1; continue; }
                if (rateLimited) break;
                try {
                  await github.request('DELETE /orgs/{org}/packages/{package_type}/{package_name}/versions/{package_version_id}', {
                    org: owner, package_type: type, package_name: name, package_version_id: v.id,
                  });
                  deleted += 1;
                } catch (error) {
                  if (error.status === 403 || error.status === 429) rateLimited = true;
                  failed += 1;
                  core.warning(`${label}: ${error.message}`);
                }
              }
              rows.push([name, type, String(versions.length), String(versions.length - victims.length), String(deleted), String(failed)]);
            }

            const summary = core.summary.addHeading('Package versions', 3);
            if (rows.length > 1) summary.addTable(rows);
            await summary
              .addRaw(rows.length > 1
                ? `Kept the newest ${keep} tagged versions of containers (with their children, signatures and attestations) and the newest ${keep} versions of npm packages.${rateLimited ? ' Stopped early: rate limited.' : ''}`
                : 'No container or npm packages are linked to this repository.', true)
              .write();
