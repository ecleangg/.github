name: Delete old Action runs

on:
  schedule:
    - cron: "0 3 * * *" # Run daily at 03:00 UTC
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-slim
    permissions:
      actions: write
      contents: read

    steps:
      - name: Delete old Action runs
        uses: Mattraks/delete-workflow-runs@b3018382ca039b53d238908238bd35d1fb14f8ee # v2.1.0
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 7
          keep_minimum_runs: 0
