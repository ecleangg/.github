# Pull request hygiene: Conventional Commits title and automatic labels, for pull requests in a
# private repo on the Free plan (no rulesets). Call it on pull_request with the
# types opened, edited, synchronize, reopened, ready_for_review, labeled and unlabeled, and make
# the jobs required in branch protection.
#
# - The metadata checks (title, labels) are cheap API calls and run on drafts too.
# - No checkout and no third-party actions: the checks are actions/github-script.
# - The labeler job skips itself when the repo has no .github/labeler.yml.
name: PR hygiene

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
      types:
        description: "Comma-separated Conventional Commits types allowed in the title"
        type: string
        default: feat,fix,docs,refactor,perf,test,build,ci,chore,revert
      require-lowercase:
        description: "Require the subject to start with a lowercase letter"
        type: boolean
        default: true
      labeler:
        description: "Run actions/labeler when the repo has .github/labeler.yml"
        type: boolean
        default: true

permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          TYPES: ${{ inputs.types }}
          REQUIRE_LOWERCASE: ${{ inputs.require-lowercase }}
        with:
          script: |
            const title = process.env.PR_TITLE || '';
            const types = process.env.TYPES.split(',').map((t) => t.trim()).filter(Boolean);
            const lowercase = process.env.REQUIRE_LOWERCASE === 'true';
            const problems = [];

            const match = /^([a-z]+)(?:\(([^()\s][^()]*)\))?(!)?: (.+)$/.exec(title);
            if (!match) {
              problems.push('The title does not match `type(scope)!: subject`.');
            } else {
              const [, type, , , subject] = match;
              if (!types.includes(type)) {
                problems.push(`Type \`${type}\` is not allowed. Use one of: ${types.join(', ')}.`);
              }
              if (lowercase && /^\p{Lu}/u.test(subject)) {
                problems.push('The subject must start with a lowercase letter.');
              }
              if (subject.trimEnd().endsWith('.')) {
                problems.push('The subject must not end with a period.');
              }
            }

            const summary = core.summary.addHeading('PR title', 3).addRaw(`Title: \`${title}\``, true);
            if (problems.length === 0) {
              await summary.addRaw('Valid Conventional Commits title.', true).write();
              return;
            }
            const example = `${types[0] || 'feat'}(api): add retry to the export job`;
            const list = problems.map((p) => `- ${p}`).join('\n');
            await summary
              .addRaw(`${list}\n\nFormat: \`type(scope)!: subject\` (scope and \`!\` optional). Example: \`${example}\``, true)
              .write();
            core.setFailed(`Invalid PR title "${title}"\n${problems.join('\n')}\nExpected: type(scope)!: subject, e.g. "${example}"`);

  labeler:
    name: Labeler
    if: ${{ inputs.labeler }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: config
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            try {
              await github.rest.repos.getContent({
                ...context.repo,
                path: '.github/labeler.yml',
                ref: context.payload.pull_request.base.ref,
              });
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info('No .github/labeler.yml in the repo; skipping.');
              core.setOutput('exists', 'false');
            }
      - if: ${{ steps.config.outputs.exists == 'true' }}
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
