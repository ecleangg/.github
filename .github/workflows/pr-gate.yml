# Draft and changed-files gate for a repo's CI. Call it first and make the heavy jobs need it; see
# docs/ci-standard.md for the caller pattern.
#
# On a draft pull request the gate job is skipped by its `if:` (GitHub decides that without a
# runner), so every job that needs it is skipped too: drafts run only the cheap security checks.
# Marking the pull request ready for review (`ready_for_review`) starts the full run.
#   run-full  true when the gate ran (any event but a draft pull request)
#   full      true when everything has to be checked (push, schedule, manual run, or a pull request
#             touching a lockfile, toolchain pin or tool configuration)
#   matches   JSON object, one boolean per `filters` name: fromJSON(needs.gate.outputs.matches).rust
name: PR gate

on:
  workflow_call:
    inputs:
      filters:
        description: "Newline-separated `name: glob !glob ...` lines, see actions/changed-files"
        type: string
        default: |
          code: * !*.md !docs/* !LICENSE* !.github/ISSUE_TEMPLATE/* !.github/*.md
      full-patterns:
        description: "Extra newline-separated globs that make a pull request run everything"
        type: string
        default: ""
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
    outputs:
      run-full:
        description: "true when the gate ran, i.e. the event is not a draft pull request"
        value: ${{ jobs.gate.outputs.run-full }}
      full:
        description: "true when everything has to be checked"
        value: ${{ jobs.gate.outputs.full }}
      reason:
        description: "Why `full` is true, or `changed files`"
        value: ${{ jobs.gate.outputs.reason }}
      matches:
        description: "JSON object, one boolean per filter name"
        value: ${{ jobs.gate.outputs.matches }}

permissions: {}

jobs:
  gate:
    name: Gate
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run-full: "true"
      full: ${{ steps.changes.outputs.full }}
      reason: ${{ steps.changes.outputs.reason }}
      matches: ${{ steps.changes.outputs.matches }}
    steps:
      # The merge commit's first parent is the base branch, so two commits are the whole diff.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
          sparse-checkout: .github
      - id: changes
        uses: $/.github/actions/changed-files
        with:
          filters: ${{ inputs.filters }}
          full-patterns: ${{ inputs.full-patterns }}
