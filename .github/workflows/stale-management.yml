name: Close stale issues and PRs

on:
  schedule:
    - cron: "0 7 * * *" # Run daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stale-management
  cancel-in-progress: false

jobs:
  stale:
    permissions:
      actions: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/stale.yml
