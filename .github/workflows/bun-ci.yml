# CI for a Bun/TypeScript repo: verify (format, lint, type check, tests, extra checks, audit) and
# build, in parallel. Verify runs on every non-draft event (its steps skip when no code changed), so
# it is the check to require. See docs/ci-standard.md for the caller.
#
# - Draft pull requests skip every job (GitHub decides that from `if:`, without a runner); marking
#   the pull request ready for review runs it.
# - A pull request that only touches files outside the `code` filter (docs) skips the steps.
# - On pull requests, commands written with `ci-scope` (actions/changed-files) see only the changed
#   files; `CI_CHANGES_BASE` lets tools find related tests themselves (`vitest run --changed "$CI_CHANGES_BASE"`).
#   Pushes, schedules, manual runs and pull requests touching a lockfile or tool configuration run
#   everything.
# - Pushes check the files changed since the previous commit of the branch, like a pull request
#   (except a verify job with a coverage file, whose report is the baseline and covers everything).
# - Workspace caches (cache-paths) live on the self-hosted runner's disk (actions/local-cache); every
#   ref restores its own newest entry or the default branch's, and saves its own (one per ref).
#   Bun itself is installed on those runners (the version file's pin is fetched when it differs), and
#   its package cache is on their disk already.
# - A job that already passed on the same git tree skips its steps (actions/test-results,
#   `reuse-results`); the default branch's verify still runs when it reports coverage.
name: Bun CI

on:
  workflow_call:
    inputs:
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'
      working-directory:
        description: "Directory of the Bun project, relative to the repository root"
        type: string
        default: "."
      bun-version-file:
        description: "File setup-bun reads the Bun version from, relative to working-directory"
        type: string
        default: package.json
      registries:
        description: "setup-bun `registries`, e.g. '@ecleangg:https://npm.pkg.github.com/|$NODE_AUTH_TOKEN'; the workflow token is NODE_AUTH_TOKEN (grant packages: read)"
        type: string
        default: ""
      fetch-depth:
        description: "Commits to fetch; 2 covers the pull request diff, 0 is the full history (tools that need the merge base)"
        type: number
        default: 2
      install:
        description: "Install command"
        type: string
        default: bun install --frozen-lockfile
      env:
        description: "Newline-separated NAME=value lines exported to every step (no secrets)"
        type: string
        default: ""
      filters:
        description: "actions/changed-files filters; steps run only when `code` matches"
        type: string
        default: |
          code: * !*.md !docs/* !LICENSE* !.github/ISSUE_TEMPLATE/* !.github/*.md
      full-patterns:
        description: "Extra globs that make a pull request check everything"
        type: string
        default: ""
      format:
        description: 'Format check, e.g. ci-scope --full "bun run format:check" -- bunx oxfmt --check'
        type: string
        default: ""
      lint:
        description: "Lint command(s); runs in parallel with format and typecheck"
        type: string
        default: ""
      typecheck:
        description: "Type check command(s)"
        type: string
        default: ""
      playwright-browsers:
        description: "Browsers to install before the tests, e.g. chromium firefox (system libraries are on the runner)"
        type: string
        default: ""
      test:
        description: "Test command(s)"
        type: string
        default: ""
      extra:
        description: "More checks after the tests, as a multi-line script"
        type: string
        default: ""
      audit:
        description: "Dependency audit command; runs on every non-draft event, not scoped by changes"
        type: string
        default: ""
      coverage-file:
        description: "Coverage report for actions/coverage-summary (empty: none)"
        type: string
        default: ""
      coverage-format:
        description: "lcov, go or vitest-json"
        type: string
        default: lcov
      coverage-name:
        description: "Name of the coverage comment and baseline artifact; defaults to the repository name"
        type: string
        default: ""
      cache-paths:
        description: "Workspace paths kept between verify runs, relative to working-directory (e.g. .svelte-kit, node_modules/.cache)"
        type: string
        default: ""
      build:
        description: "Build command(s); empty skips the build job"
        type: string
        default: ""
      build-cache-paths:
        description: "Workspace paths kept between build runs, relative to working-directory"
        type: string
        default: ""
      reuse-results:
        description: "Skip the checks when the same job already passed on the same git tree"
        type: boolean
        default: true
      verify-timeout-minutes:
        type: number
        default: 30
      build-timeout-minutes:
        type: number
        default: 20

permissions: {}

jobs:
  verify:
    name: Verify
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.verify-timeout-minutes }}
    permissions:
      contents: read
      packages: read # @ecleangg packages from GitHub Packages.
      actions: read # Coverage baseline download.
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }} # 2: the pull request merge commit and its base parent.
          persist-credentials: false
      - &changes
        id: changes
        uses: $/.github/actions/changed-files
        with:
          filters: ${{ inputs.filters }}
          full-patterns: ${{ inputs.full-patterns }}
          push-diff: ${{ github.job != 'verify' || inputs.coverage-file == '' }}
      - &results
        name: Earlier result
        id: results
        if: inputs.reuse-results && github.event_name != 'schedule'
        uses: $/.github/actions/test-results
        with:
          mode: lookup
          kind: bun-${{ github.job }}
          variant: ${{ inputs.working-directory }}|${{ inputs.env }}|${{ inputs.playwright-browsers }}
      - &env
        name: Export env
        id: run
        env:
          INPUT_ENV: ${{ inputs.env }}
          MATCHES: ${{ steps.changes.outputs.matches }}
          # The default branch's verify reports the coverage baseline, so it runs anyway.
          REUSE: >-
            ${{ steps.results.outputs.hit == 'true' && !(github.job == 'verify' && inputs.coverage-file != '' &&
            github.ref_name == github.event.repository.default_branch) }}
          RESULT_URL: ${{ steps.results.outputs.run-url }}
        run: |
          printf '%s\n' "$INPUT_ENV" | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' >> "$GITHUB_ENV" || true
          code="$(jq -r '.code // true' <<< "$MATCHES")"
          if [ "$code" = true ] && [ "$REUSE" = true ]; then
            echo "Passed on this tree in ${RESULT_URL:-an earlier run}: skipped." >> "$GITHUB_STEP_SUMMARY"
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" = true ] || echo "Nothing to run: skipping." >> "$GITHUB_STEP_SUMMARY"
      # The self-hosted runners have Bun installed; GitHub-hosted runners set it up.
      - &setup-bun
        if: steps.run.outputs.code == 'true' && runner.environment == 'github-hosted'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: ${{ inputs.working-directory }}/${{ inputs.bun-version-file }}
          registries: ${{ inputs.registries }}
      # Self-hosted runners have a Bun installed; a project pinning another version gets that exact
      # release, downloaded once (checksum-verified) into the shared Bun directory.
      - &pin-bun
        name: Bun version
        if: steps.run.outputs.code == 'true' && runner.environment == 'self-hosted' && runner.os == 'Linux'
        env:
          VERSION_FILE: ${{ inputs.bun-version-file }}
        run: |
          case "$VERSION_FILE" in
            *.json) want="$(jq -r '(.packageManager // "" | capture("^bun@(?<v>[0-9]+[.][0-9]+[.][0-9]+)").v) // .engines.bun // empty' "$VERSION_FILE" 2> /dev/null || true)" ;;
            *) want="$(tr -d ' v\r\n' < "$VERSION_FILE" 2> /dev/null || true)" ;;
          esac
          have="$(bun --version 2> /dev/null || true)"
          if ! [[ "$want" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$want" = "$have" ]; then
            echo "Bun ${have:-missing}${want:+ (pin: $want)}"
            exit 0
          fi
          case "$(uname -m)" in x86_64) arch=x64 ;; aarch64 | arm64) arch=aarch64 ;; *) arch="$(uname -m)" ;; esac
          root="${BUN_INSTALL:-$HOME/.bun}/versions"
          dir="$root/$want"
          mkdir -p "$root"
          if [ ! -x "$dir/bin/bun" ]; then
            (
              flock 9
              [ -x "$dir/bin/bun" ] && exit 0
              tmp="$(mktemp -d)"
              trap 'rm -rf "$tmp"' EXIT
              base="https://github.com/oven-sh/bun/releases/download/bun-v$want"
              curl -fsSL --retry 3 -o "$tmp/bun-linux-$arch.zip" "$base/bun-linux-$arch.zip"
              curl -fsSL --retry 3 -o "$tmp/SHASUMS256.txt" "$base/SHASUMS256.txt"
              (cd "$tmp" && grep " bun-linux-$arch.zip\$" SHASUMS256.txt | sha256sum -c -)
              unzip -q "$tmp/bun-linux-$arch.zip" -d "$tmp"
              mkdir -p "$dir.new/bin"
              mv "$tmp/bun-linux-$arch/bun" "$dir.new/bin/bun"
              ln -sf bun "$dir.new/bin/bunx"
              rm -rf "$dir" && mv "$dir.new" "$dir"
            ) 9> "$root/.lock"
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          echo "Bun $want (pinned; the runner has ${have:-none})"
      - name: Restore workspace caches
        id: cache
        if: steps.run.outputs.code == 'true' && inputs.cache-paths != ''
        uses: $/.github/actions/local-cache/restore
        with:
          path: ${{ inputs.cache-paths }}
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: bun-verify-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-${{ github.sha }}
          restore-keys: |
            bun-verify-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-
            bun-verify-${{ runner.os }}-
      - &install
        name: Install dependencies
        id: install
        if: steps.run.outputs.code == 'true'
        env:
          INSTALL: ${{ inputs.install }}
        run: bash -euo pipefail -c "$INSTALL"
      - name: Install Playwright browsers
        if: steps.run.outputs.code == 'true' && inputs.playwright-browsers != ''
        env:
          BROWSERS: ${{ inputs.playwright-browsers }}
        run: |
          # shellcheck disable=SC2086 # One word per browser.
          bunx playwright install $BROWSERS
      - parallel:
          - name: Format
            if: steps.run.outputs.code == 'true' && inputs.format != ''
            env:
              CMD: ${{ inputs.format }}
            run: bash -euo pipefail -c "$CMD"
          - name: Lint
            if: steps.run.outputs.code == 'true' && inputs.lint != ''
            env:
              CMD: ${{ inputs.lint }}
            run: bash -euo pipefail -c "$CMD"
          - name: Type check
            if: steps.run.outputs.code == 'true' && inputs.typecheck != ''
            env:
              CMD: ${{ inputs.typecheck }}
            run: bash -euo pipefail -c "$CMD"
      - name: Test
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.test != '' }}
        env:
          CMD: ${{ inputs.test }}
        run: bash -euo pipefail -c "$CMD"
      - name: Extra checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.extra != '' }}
        env:
          CMD: ${{ inputs.extra }}
        run: bash -euo pipefail -c "$CMD"
      - name: Dependency audit
        if: ${{ !cancelled() && inputs.audit != '' && steps.install.outcome == 'success' }}
        env:
          CMD: ${{ inputs.audit }}
        run: bash -euo pipefail -c "$CMD"
      - name: Coverage summary
        if: ${{ !cancelled() && steps.install.outcome == 'success' && inputs.coverage-file != '' && hashFiles(format('{0}/{1}', inputs.working-directory, inputs.coverage-file)) != '' }}
        uses: $/.github/actions/coverage-summary
        with:
          name: ${{ inputs.coverage-name != '' && inputs.coverage-name || github.event.repository.name }}
          format: ${{ inputs.coverage-format }}
          file: ${{ inputs.working-directory }}/${{ inputs.coverage-file }}
      - &record
        name: Record the result
        if: ${{ success() && steps.run.outputs.code == 'true' && inputs.reuse-results }}
        uses: $/.github/actions/test-results
        with:
          mode: record
          kind: bun-${{ github.job }}
          variant: ${{ inputs.working-directory }}|${{ inputs.env }}|${{ inputs.playwright-browsers }}
      # Every ref keeps its newest entry (supersedes is per ref); the weekly prune drops idle refs'.
      - name: Save workspace caches
        if: ${{ success() && steps.run.outputs.code == 'true' && inputs.cache-paths != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: $/.github/actions/local-cache/save
        with:
          path: ${{ inputs.cache-paths }}
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: bun-verify-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-${{ github.sha }}
          supersedes: bun-verify-${{ runner.os }}-

  build:
    name: Build
    if: ${{ !github.event.pull_request.draft && inputs.build != '' }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: ${{ inputs.build-timeout-minutes }}
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - *checkout
      - *changes
      - *results
      - *env
      - *setup-bun
      - *pin-bun
      - name: Restore build caches
        id: cache
        if: steps.run.outputs.code == 'true' && inputs.build-cache-paths != ''
        uses: $/.github/actions/local-cache/restore
        with:
          path: ${{ inputs.build-cache-paths }}
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: bun-build-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-${{ github.sha }}
          restore-keys: |
            bun-build-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-
            bun-build-${{ runner.os }}-
      - *install
      - name: Build
        if: steps.run.outputs.code == 'true'
        env:
          CMD: ${{ inputs.build }}
        run: bash -euo pipefail -c "$CMD"
      - *record
      - name: Save build caches
        if: ${{ success() && steps.run.outputs.code == 'true' && inputs.build-cache-paths != '' && steps.cache.outputs.cache-hit != 'true' }}
        uses: $/.github/actions/local-cache/save
        with:
          path: ${{ inputs.build-cache-paths }}
          working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
          key: bun-build-${{ runner.os }}-${{ hashFiles('**/bun.lock', '!**/node_modules/**') }}-${{ github.sha }}
          supersedes: bun-build-${{ runner.os }}-
