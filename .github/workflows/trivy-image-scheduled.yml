name: Trivy image (scheduled)

# Reusable: pulls a published image and lists every HIGH and CRITICAL finding in the job summary. It
# reports the full backlog and never fails. Call it from a `schedule` workflow. An image on ghcr.io is
# pulled with the repo's GITHUB_TOKEN (the calling job needs `packages: read`); any other registry, our
# Forgejo one, with the login in OpenBao (kv/ci/<repo>/forgejo-registry), read through the repo's
# `ci-<repo>` role (the calling job needs `id-token: write`). The calling job always needs `contents: read`.
on:
  workflow_call:
    inputs:
      image:
        description: "Image reference to scan, e.g. git.eclean.gg/ecleangg/api-rs:latest or an @sha256 digest"
        type: string
        required: true
      ignore-file:
        description: "Path of a .trivyignore in the calling repository; findings listed there are not reported"
        type: string
        default: ".trivyignore"
      runs-on:
        description: 'Runner label, or a JSON array of labels; defaults to the self-hosted Linux pool'
        type: string
        default: '["self-hosted","Linux","X64"]'

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ inputs.image }}
    runs-on: ${{ startsWith(inputs.runs-on, '[') && fromJSON(inputs.runs-on) || inputs.runs-on }}
    timeout-minutes: 14
    permissions:
      contents: read
      packages: read
      id-token: write # The OpenBao login for a Forgejo image.
    steps:
      # Only the ignore file is needed from the calling repository.
      - name: Fetch the ignore file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: ${{ inputs.ignore-file }}
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - id: openbao
        if: ${{ !startsWith(inputs.image, 'ghcr.io/') }}
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: https://secret.eclean.gg
          method: jwt
          role: ci-${{ github.event.repository.name }}
          jwtGithubAudience: https://secret.eclean.gg
          exportEnv: false
          # vault-action splits secrets on semicolons, not on lines.
          secrets: |
            kv/data/ci/${{ github.event.repository.name }}/forgejo-registry username | REGISTRY_USERNAME ;
            kv/data/ci/${{ github.event.repository.name }}/forgejo-registry token | REGISTRY_TOKEN

      - name: Scan the image
        uses: ecleangg/.github/.github/actions/trivy-image@49318d61cf35fa97d63c8eb408c9b82e4ff67864 # main
        with:
          image: ${{ inputs.image }}
          ignore-file: ${{ inputs.ignore-file }}
          fail: "false"
          registry-username: ${{ startsWith(inputs.image, 'ghcr.io/') && github.actor || steps.openbao.outputs.REGISTRY_USERNAME }}
          registry-password: ${{ startsWith(inputs.image, 'ghcr.io/') && github.token || steps.openbao.outputs.REGISTRY_TOKEN }}
