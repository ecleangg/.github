name: Find leaked secrets

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: find-secrets-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secrets:
    permissions:
      contents: read
    uses: ./.github/workflows/security.yml
    with:
      workflows: false
      secrets: true
