name: Coverage summary
description: >-
  Reports coverage in the job summary and, on pull requests, as a comment: totals, the delta
  against the latest run on the default branch, the 10 lowest-covered files and a collapsed full
  table. Report only. The pull request run never posts: it uploads the comment body as the artifact
  `pr-comment-coverage-<name>`, and the `workflow_run` workflow `pr-comments.yml` posts it as
  eclean-ci[bot] from the default branch, where the app's key is readable. On a push to the default
  branch it uploads the baseline artifact `coverage-<name>`. The caller needs `actions: read`
  (baseline download); no write permission.

inputs:
  name:
    description: "Short name of this coverage report, e.g. `api` or `web`. Letters, digits, `.`, `_`, `-`. Keys the comment header and the baseline artifact."
    required: true
  format:
    description: "`lcov` (cargo llvm-cov --lcov, vitest lcov), `go` (go test -coverprofile) or `vitest-json` (vitest json-summary)."
    required: true
  file:
    description: "Path to the coverage file."
    required: true
  compare:
    description: >-
      all (the whole report against the whole baseline) or report-files (a partial run: the baseline is
      limited to the files in this report). A report-files run never uploads the baseline.
    required: false
    default: all
  baseline-artifact:
    description: "Name of the baseline artifact. Defaults to `coverage-<name>`."
    required: false
    default: ""
  fail-on-error:
    description: "Fail the step when the file cannot be parsed. Missing baselines never fail."
    required: false
    default: "false"
  comment:
    description: "Upload the comment body as the artifact `pr-comment-coverage-<name>` on pull requests, for pr-comments.yml to post."
    required: false
    default: "true"
  github-token:
    description: "Token to list and download the baseline (actions: read)."
    required: false
    default: ${{ github.token }}

outputs:
  line-percent:
    description: "Total line (Go: statement) coverage in percent, empty if it could not be computed."
    value: ${{ steps.report.outputs.line-percent }}
  branch-percent:
    description: "Total branch coverage in percent, empty if there is none."
    value: ${{ steps.report.outputs.branch-percent }}
  report-file:
    description: "Path of the markdown report."
    value: ${{ steps.report.outputs.report-file }}

runs:
  using: composite
  steps:
    - name: Validate the name
      shell: bash
      env:
        COVERAGE_NAME: ${{ inputs.name }}
      run: |
        case "$COVERAGE_NAME" in
          ''|*[!A-Za-z0-9._-]*) echo "::error::name must be letters, digits, '.', '_' or '-'"; exit 1 ;;
        esac

    - name: Find the baseline from the default branch
      id: baseline
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REPO: ${{ github.repository }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ARTIFACT: ${{ inputs.baseline-artifact || format('coverage-{0}', inputs.name) }}
        DEST: ${{ runner.temp }}/coverage-baseline
      run: |
        set +e -uo pipefail
        mkdir -p "$DEST"
        note=""
        # The latest unexpired artifact of that name that a run on the default branch uploaded;
        # the upload step only runs after a successful run.
        run_id="$(gh api "repos/$REPO/actions/artifacts?name=$ARTIFACT&per_page=100" \
          --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$DEFAULT_BRANCH\")] | first | .workflow_run.id // empty" 2>"$DEST/err")" || run_id=""
        if [ -z "$run_id" ]; then
          note="No baseline artifact \`$ARTIFACT\` from \`$DEFAULT_BRANCH\` yet (it is uploaded on pushes to \`$DEFAULT_BRANCH\`); no delta."
          [ -s "$DEST/err" ] && echo "::warning title=coverage-summary::could not list artifacts: $(head -c 200 "$DEST/err")"
        elif ! gh run download "$run_id" --repo "$REPO" --name "$ARTIFACT" --dir "$DEST" 2>"$DEST/err"; then
          note="The baseline artifact \`$ARTIFACT\` could not be downloaded; no delta."
          echo "::warning title=coverage-summary::download failed: $(head -c 200 "$DEST/err")"
        fi
        echo "dir=$DEST" >> "$GITHUB_OUTPUT"
        printf 'note=%s\n' "$note" >> "$GITHUB_OUTPUT"

    - name: Build the report
      id: report
      shell: bash
      env:
        COVERAGE_NAME: ${{ inputs.name }}
        COVERAGE_FORMAT: ${{ inputs.format }}
        COVERAGE_FILE: ${{ inputs.file }}
        COVERAGE_FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        COVERAGE_OUT_DIR: ${{ runner.temp }}/coverage-out
        COVERAGE_BASELINE_DIR: ${{ steps.baseline.outputs.dir }}
        COVERAGE_BASELINE_NOTE: ${{ steps.baseline.outputs.note }}
        COVERAGE_COMPARE: ${{ inputs.compare }}
      run: node "${{ github.action_path }}/report.js"

    - name: Stage the comment
      id: stage
      if: ${{ github.event_name == 'pull_request' && inputs.comment == 'true' && steps.report.outputs.report-file != '' }}
      shell: bash
      env:
        COVERAGE_NAME: ${{ inputs.name }}
        REPORT: ${{ steps.report.outputs.report-file }}
        DEST: ${{ runner.temp }}/pr-comment/coverage-${{ inputs.name }}
      run: |
        set -euo pipefail
        [ -f "$REPORT" ] || exit 0
        mkdir -p "$DEST"
        cp "$REPORT" "$DEST/body.md"
        echo "staged=true" >> "$GITHUB_OUTPUT"

    # Posted by pr-comments.yml (workflow_run), keyed by the artifact name: `pr-comment-<header>`.
    - name: Upload the comment
      if: ${{ steps.stage.outputs.staged == 'true' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: pr-comment-coverage-${{ inputs.name }}
        path: ${{ runner.temp }}/pr-comment/coverage-${{ inputs.name }}/body.md
        retention-days: 1
        overwrite: true
        if-no-files-found: ignore

    - name: Upload the baseline
      if: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && inputs.compare == 'all' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.baseline-artifact || format('coverage-{0}', inputs.name) }}
        path: ${{ runner.temp }}/coverage-out/${{ inputs.name }}/coverage-${{ inputs.name }}.json
        retention-days: 30
        overwrite: true
        if-no-files-found: ignore
